[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "route-incident-lab"
version = "0.2.0"
description = "Router-state diff, HTTP delivery evidence, and opt-in local FRRouting fault tests"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Yikai Zhao"}]
dependencies = []

[project.scripts]
routeincident = "routeincident.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
